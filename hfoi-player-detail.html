<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HFOIERDB - 选手详情</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="player-detail">
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="./index.html">HFOI</a>
        <nav class="nav">
          <a data-nav="home" href="./index.html">首页</a>
          <a data-nav="players" href="./hfoi-players.html">选手</a>
          <a data-nav="schools" href="./hfoi-schools.html">学校</a>
          <a data-nav="contests" href="./hfoi-contests.html">比赛</a>
        <a data-nav="about" href="./hfoi-about.html">关于</a>
        </nav>
      </div>
    </header>

    <main class="container page">
    <section class="panel">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem">
          <div>
            <h1 id="playerDetailTitle" style="display:inline;margin:0;font-size:1.2rem;vertical-align:middle">选手详情</h1>
            <span style="margin-left:0.5rem;color:hsl(var(--muted-foreground));font-size:0.85rem">比赛记录</span>
          </div>
          <div style="text-align:right">
            <strong id="playerDetailRating" style="font-size:1.2rem">-</strong>
            <div style="font-size:0.75rem;color:hsl(var(--muted-foreground));white-space:nowrap">(评级仅供参考)</div>
            <div id="playerDetailScore" style="font-size:0.85rem;margin:2px 0"></div>
          </div>
       </div>
    </section>

      <section class="panel" id="playerProfilePanel" style="display:none">
        <div class="profile-panel">
          <div class="profile-item"><span class="profile-label">洛谷 ID</span><span class="profile-value" id="profileLuogu" style="margin-left:0.4rem">-</span></div>
          <div class="profile-item"><span class="profile-label">Codeforces</span><span class="profile-value" id="profileCF" style="margin-left:0.4rem">-</span></div>
          <div class="profile-item"><span class="profile-label">AtCoder</span><span class="profile-value" id="profileAtCoder" style="margin-left:0.4rem">-</span></div>
        </div>
      </section>

      <section class="panel" id="playerRecordsPanel">
        <div class="summary" id="playerDetailSummary">加载中...</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>比赛</th>
                <th>学校</th>
                <th>奖项</th>
                <th>排名</th><th>分数变化</th>
              </tr>
            </thead>
            <tbody id="playerDetailBody"></tbody>
          </table>
        </div>
      </section>
    </main>

      <section class="panel" id="playerAchievementPanel" style="display:none">
        <h2>选手成就</h2>
        <div class="achievement-list" id="playerAchievementBody"></div>
      </section>

    <footer class="container footer">
      <small>Made with 💖 by 北大侯老师信息学团队</small>
    </footer>

    <script src="./site.js?v=20260711a" defer></script>
  </body>
</html>
