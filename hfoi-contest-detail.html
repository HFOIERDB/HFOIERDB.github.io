<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <title>HFOIERDB - 比赛详情</title>
    <link rel="stylesheet" href="./styles.css" />

  </head>
  <body data-page="contest-detail">
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="./index.html">HFOI</a>
        <nav class="nav">
          <a data-nav="home" href="./index.html">首页</a>
          <a data-nav="players" href="./hfoi-players.html">选手</a>
          <a data-nav="schools" href="./hfoi-schools.html">学校</a>
          <a data-nav="contests" href="./hfoi-contests.html">比赛</a>
        </nav>
      </div>
    </header>

    <main class="container page">
      <section class="panel">
        <h1 id="detailTitle">比赛详情</h1>
        <p class="sub"><a class="table-link" href="./hfoi-contests.html">返回比赛列表</a></p>
        <div class="tab-group" id="contestDetailTabGroup" style="margin-top:0.7rem">

          <button class="tab-btn" data-tab="schools">学校奖项</button>
        </div>
      </section>

      <section class="panel" id="contestPlayersPanel">
        <div class="summary" id="detailSummary">加载中...</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>排名</th>
                <th>姓名</th>
                <th>学校</th>

                <th>年份</th>
              </tr>
            </thead>
            <tbody id="detailBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel" id="contestSchoolsPanel" style="display:none">
        <div class="summary" id="schoolAwardSummary">加载中...</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>排名</th>
                <th>学校</th>
                <th>团体一等奖</th>
                <th>团体二等奖</th>
                <th>团体三等奖</th>
              </tr>
            </thead>
